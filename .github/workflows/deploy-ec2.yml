name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ec2
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          command_timeout: 40m
          script_stop: true
          script: |
            set -euo pipefail
            cd ~/mederp

            if [ ! -d .git ]; then
              echo "ERROR: ~/mederp is not a git repo yet. Run the one-time EC2 git setup first."
              exit 1
            fi

            git fetch origin main
            git reset --hard origin/main

            if [ ! -f apps/web/.env ]; then
              echo "ERROR: apps/web/.env missing on server. Copy it once and keep it only on EC2."
              exit 1
            fi

            if ! grep -qE '^(ASKEVA_API_TOKEN|WHATSAPP_ACCESS_TOKEN)=' apps/web/.env; then
              echo "ERROR: apps/web/.env is missing ASKEVA_API_TOKEN. Add the same AskEva API key used on local, then redeploy."
              exit 1
            fi

            ensure_env() {
              local key="$1"
              local value="$2"
              if ! grep -q "^${key}=" apps/web/.env; then
                printf '%s=%s\n' "$key" "$value" >> apps/web/.env
                echo "Added ${key} to apps/web/.env"
              fi
            }

            PUBLIC_API_URL="$(grep -E '^NEXT_PUBLIC_API_URL=' apps/web/.env | head -n1 | cut -d= -f2- | tr -d '"' || true)"
            ensure_env ASKEVA_API_URL "https://backend.askeva.io/v1"
            ensure_env WHATSAPP_TEMPLATE_LANG "en,en_IN"
            ensure_env WHATSAPP_OTP_TEMPLATE "as"
            ensure_env WHATSAPP_REMINDER_PARAMS "named"
            ensure_env WHATSAPP_REMINDER_TEMPLATE "appointment_reminder1"
            ensure_env WHATSAPP_INVESTIGATION_TEMPLATE "investigation_list"
            ensure_env WHATSAPP_VISIT_SUMMARY_TEMPLATE "visit_summary_"
            ensure_env WHATSAPP_BILL_RECEIPT_TEMPLATE "billpreceipt"
            if [ -n "$PUBLIC_API_URL" ]; then
              ensure_env WHATSAPP_MEDIA_BASE_URL "$PUBLIC_API_URL"
            fi

            sudo docker compose --env-file apps/web/.env -f docker-compose.prod.yml up -d --build
            sudo docker compose --env-file apps/web/.env -f docker-compose.prod.yml ps

            echo "Waiting for /api/health (app needs a few seconds after container start)..."
            ok=0
            for i in $(seq 1 30); do
              if curl -fsS -m 5 http://127.0.0.1/api/health; then
                ok=1
                break
              fi
              echo "  not ready yet ($i/30)"
              sleep 4
            done
            if [ "$ok" != "1" ]; then
              echo "Health check failed. Recent web logs:"
              sudo docker compose --env-file apps/web/.env -f docker-compose.prod.yml logs --tail=80 web
              exit 1
            fi
            echo
            echo "Deploy finished."
