services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: mederp
    command: postgres -c shared_buffers=64MB -c max_connections=50
    volumes:
      - mederp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mederp"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL}
        NEXT_PUBLIC_RAZORPAY_KEY_ID: ${NEXT_PUBLIC_RAZORPAY_KEY_ID}
    restart: unless-stopped
    ports:
      - "80:3000"
    env_file:
      - apps/web/.env
    environment:
      NODE_ENV: production
      PORT: "3000"
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/mederp?schema=public
    depends_on:
      db:
        condition: service_healthy

volumes:
  mederp_pgdata:
