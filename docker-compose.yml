services:
  db:
    image: postgres:16
    container_name: mederp-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mederp_dev
      POSTGRES_DB: mederp
    volumes:
      - mederp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mederp"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mederp_pgdata:
